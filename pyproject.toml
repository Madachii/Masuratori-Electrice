[project]
name = "masuratori-electrice"
version = "0.1.0"
description = "Modbus RTU tools for Eaton PXR trip units"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pymodbus>=3.16.1",
    "pyserial>=3.5",
]

[project.scripts]
masuratori = "masuratori_electrice.cli:main"
portcheck = "masuratori_electrice.portcheck:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["masuratori_electrice"]
