[project]
name = "masuratori-backend"
version = "0.1.0"
description = "FastAPI backend that stores PXR measurements"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
